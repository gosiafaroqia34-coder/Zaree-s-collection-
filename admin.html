<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zaree Collection | Admin Panel</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff7fa;
    color:#222;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#fff0f5;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h1{
    text-align:center;
    color:#c2185b;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#c2185b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#loginMessage{
    text-align:center;
    margin-top:12px;
    color:#c2185b;
}

/* ADMIN */

#adminPage{
    display:none;
}

header{
    background:white;
    padding:15px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#c2185b;
}

.logout{
    border:0;
    background:#222;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px;
}

.title{
    margin-bottom:25px;
}

.title h1{
    margin-bottom:7px;
}

.title p{
    color:#777;
}

/* FORM */

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    margin-bottom:35px;
}

.form-box h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

.form-group textarea{
    min-height:100px;
    resize:vertical;
}

.save-btn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#c2185b;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.cancel-btn{
    margin-top:10px;
    width:100%;
    padding:11px;
    border:0;
    border-radius:7px;
    background:#eee;
    cursor:pointer;
    display:none;
}

/* PRODUCTS */

.products-title{
    margin-bottom:18px;
}

.product-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.product-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.product-img{
    height:220px;
    background:#f8e7ee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    font-size:55px;
}

.product-content{
    padding:16px;
}

.product-content h3{
    margin-bottom:7px;
}

.product-price{
    color:#c2185b;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.product-info{
    color:#666;
    font-size:14px;
    line-height:1.6;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.edit-btn,
.delete-btn{
    flex:1;
    padding:9px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn{
    background:#eee;
}

.delete-btn{
    background:#222;
    color:white;
}

.status{
    margin-top:12px;
    text-align:center;
    color:#c2185b;
    font-weight:bold;
}

/* MOBILE */

@media(max-width:800px){

    .product-list{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .product-list{
        grid-template-columns:1fr;
    }

    header{
        justify-content:center;
    }
}
</style>
</head>

<body>


<!-- LOGIN PAGE -->

<section id="loginPage">

    <div class="login-box">

        <h1>Zaree Collection</h1>

        <p>Admin Panel</p>

        <input
            type="email"
            id="email"
            placeholder="Admin Email">

        <input
            type="password"
            id="password"
            placeholder="Password">

        <button
            class="login-btn"
            onclick="login()">

            Login

        </button>

        <div id="loginMessage"></div>

    </div>

</section>


<!-- ADMIN PAGE -->

<section id="adminPage">

<header>

    <div class="logo">
        Zaree <span>Collection</span>
    </div>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>


<div class="container">

    <div class="title">

        <h1>Admin Dashboard</h1>

        <p>
            Add and manage your beauty products
        </p>

    </div>


    <!-- PRODUCT FORM -->

    <div class="form-box">

        <h2 id="formTitle">
            Add New Product
        </h2>

        <div class="form-grid">


            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                    id="productName"
                    type="text"
                    placeholder="e.g. Matte Lipstick">

            </div>


            <div class="form-group">

                <label>
                    Price
                </label>

                <input
                    id="productPrice"
                    type="number"
                    placeholder="e.g. 899">

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select id="productCategory">

                    <option value="Makeup">
                        Makeup
                    </option>

                    <option value="Skincare">
                        Skincare
                    </option>

                    <option value="Hair Care">
                        Hair Care
                    </option>

                    <option value="Fragrance">
                        Fragrance
                    </option>

                    <option value="Body Care">
                        Body Care
                    </option>

                    <option value="Accessories">
                        Accessories
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Stock
                </label>

                <input
                    id="productStock"
                    type="number"
                    placeholder="e.g. 20">

            </div>


            <div class="form-group">

                <label>
                    Sizes
                </label>

                <input
                    id="productSizes"
                    type="text"
                    placeholder="e.g. 30ml, 50ml, 100ml">

            </div>


            <div class="form-group">

                <label>
                    Colors / Variants
                </label>

                <input
                    id="productColors"
                    type="text"
                    placeholder="e.g. Red, Pink, Nude">

            </div>


            <div class="form-group full">

                <label>
                    Image URL
                </label>

                <input
                    id="productImage"
                    type="url"
                    placeholder="Paste product image URL">

            </div>


            <div class="form-group full">

                <label>
                    Description
                </label>

                <textarea
                    id="productDescription"
                    placeholder="Write product description"></textarea>

            </div>

        </div>


        <button
            class="save-btn"
            id="saveBtn"
            onclick="saveProduct()">

            Add Product

        </button>


        <button
            class="cancel-btn"
            id="cancelBtn"
            onclick="cancelEdit()">

            Cancel Edit

        </button>


        <div
            class="status"
            id="statusMessage">
        </div>

    </div>


    <!-- PRODUCTS -->

    <div class="products-title">

        <h2>
            Your Products
        </h2>

    </div>

    <div
        class="product-list"
        id="productList">

        <p>
            Loading products...
        </p>

    </div>

</div>

</section>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyAmMUYbXG7XrdJrjBlNZ_9MkyHA9P9aTqA",

    authDomain:
    "zaree-collection-5589b.firebaseapp.com",

    projectId:
    "zaree-collection-5589b",

    storageBucket:
    "zaree-collection-5589b.firebasestorage.app",

    messagingSenderId:
    "724088426576",

    appId:
    "1:724088426576:web:d781393dfb54e2e46ec155",

    measurementId:
    "G-CHHN119YVR"
};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


let editingId = null;


/* LOGIN */

window.login = async function(){

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.textContent =
            "Email and password required.";

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.textContent = "";

    }catch(error){

        message.textContent =
            "Login failed. Check email/password.";

    }

};


/* LOGOUT */

window.logout = async function(){

    await signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(auth, function(user){

    if(user){

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("adminPage")
            .style.display = "block";

        loadProducts();

    }else{

        document.getElementById("loginPage")
            .style.display = "flex";

        document.getElementById("adminPage")
            .style.display = "none";

    }

});


/* SAVE PRODUCT */

window.saveProduct = async function(){

    const name =
        document.getElementById("productName")
        .value.trim();

    const price =
        Number(
            document.getElementById("productPrice")
            .value
        );

    const category =
        document.getElementById("productCategory")
        .value;

    const stock =
        Number(
            document.getElementById("productStock")
            .value
        );

    const sizes =
        document.getElementById("productSizes")
        .value.trim();

    const colors =
        document.getElementById("productColors")
        .value.trim();

    const image =
        document.getElementById("productImage")
        .value.trim();

    const description =
        document.getElementById("productDescription")
        .value.trim();

    const status =
        document.getElementById("statusMessage");


    if(!name || !price){

        status.textContent =
            "Product name and price are required.";

        return;

    }


    const product = {

        name:name,
        price:price,
        category:category,
        stock:stock,
        sizes:sizes,
        colors:colors,
        image:image,
        description:description,
        updatedAt:serverTimestamp()

    };


    try{

        if(editingId){

            await updateDoc(
                doc(db,"products",editingId),
                product
            );

            status.textContent =
                "Product updated successfully.";

        }else{

            await addDoc(
                collection(db,"products"),
                {
                    ...product,
                    createdAt:serverTimestamp()
                }
            );

            status.textContent =
                "Product added successfully.";

        }


        clearForm();

        loadProducts();

    }catch(error){

        status.textContent =
            "Error: " + error.message;

    }

};


/* LOAD PRODUCTS */

async function loadProducts(){

    const list =
        document.getElementById("productList");

    list.innerHTML =
        "<p>Loading products...</p>";


    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );


        if(snapshot.empty){

            list.innerHTML =
                "<p>No products added yet.</p>";

            return;

        }


        list.innerHTML = "";


        snapshot.forEach(function(document){

            const product =
                document.data();

            const id =
                document.id;


            const imageHTML =
                product.image

                ?

                `<img src="${escapeHTML(product.image)}"
                 alt="${escapeHTML(product.name || "Product")}">`

                :

                `<div class="no-image">💄</div>`;


            list.innerHTML += `

                <div class="product-card">

                    <div class="product-img">

                        ${imageHTML}

                    </div>

                    <div class="product-content">

                        <h3>
                            ${escapeHTML(product.name || "")}
                        </h3>

                        <div class="product-price">

                            Rs. ${product.price || 0}

                        </div>

                        <div class="product-info">

                            Category:
                            ${escapeHTML(product.category || "-")}

                            <br>

                            Stock:
                            ${product.stock ?? 0}

                            <br>

                            Sizes:
                            ${escapeHTML(product.sizes || "-")}

                            <br>

                            Colors:
                            ${escapeHTML(product.colors || "-")}

                        </div>

                        <div class="card-buttons">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${id}')">

                                Edit

                            </button>

                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${id}')">

                                Delete

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });

    }catch(error){

        list.innerHTML =
            "<p>Could not load products.</p>";

    }

}


/* EDIT */

window.editProduct = async function(id){

    try{

        const snapshot =
            await getDocs(
                collection(db,"products")
            );


        let found = null;


        snapshot.forEach(function(document){

            if(document.id === id){

                found = {
                    id:document.id,
                    ...document.data()
                };

            }

        });


        if(!found) return;


        editingId = id;


        document.getElementById("productName")
            .value = found.name || "";

        document.getElementById("productPrice")
            .value = found.price || "";

        document.getElementById("productCategory")
            .value = found.category || "Makeup";

        document.getElementById("productStock")
            .value = found.stock || 0;

        document.getElementById("productSizes")
            .value = found.sizes || "";

        document.getElementById("productColors")
            .value = found.colors || "";

        document.getElementById("productImage")
            .value = found.image || "";

        document.getElementById("productDescription")
            .value = found.description || "";


        document.getElementById("formTitle")
            .textContent = "Edit Product";

        document.getElementById("saveBtn")
            .textContent = "Update Product";

        document.getElementById("cancelBtn")
            .style.display = "block";


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        alert(
            "Could not open product."
        );

    }

};


/* DELETE */

window.deleteProduct = async function(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if(!confirmDelete) return;


    try{

        await deleteDoc(
            doc(db,"products",id)
        );

        loadProducts();

    }catch(error){

        alert(
            "Could not delete product."
        );

    }

};


/* CANCEL */

window.cancelEdit = function(){

    editingId = null;

    clearForm();

};


/* CLEAR FORM */

function clearForm(){

    document.getElementById("productName")
        .value = "";

    document.getElementById("productPrice")
        .value = "";

    document.getElementById("productStock")
        .value = "";

    document.getElementById("productSizes")
        .value = "";

    document.getElementById("productColors")
        .value = "";

    document.getElementById("productImage")
        .value = "";

    document.getElementById("productDescription")
        .value = "";


    document.getElementById("formTitle")
        .textContent = "Add New Product";

    document.getElementById("saveBtn")
        .textContent = "Add Product";

    document.getElementById("cancelBtn")
        .style.display = "none";

    editingId = null;

}


/* BASIC HTML ESCAPE */

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

</script>

</body>
  </html>

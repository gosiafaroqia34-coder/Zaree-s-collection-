<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zaree Collection | Admin Panel</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#fff7fa;
    color:#222;
}

/* LOGIN */

#loginPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#fff0f5;
}

.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h1{
    text-align:center;
    color:#c2185b;
    margin-bottom:8px;
}

.login-box p{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

.login-box input{
    width:100%;
    padding:13px;
    margin-bottom:14px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

.login-btn{
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#c2185b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#loginMessage{
    text-align:center;
    margin-top:12px;
    color:#c2185b;
}

/* ADMIN */

#adminPage{
    display:none;
}

header{
    background:white;
    padding:15px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.logo span{
    color:#c2185b;
}

.logout{
    border:0;
    background:#222;
    color:white;
    padding:9px 15px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:30px 18px;
}

.title{
    margin-bottom:25px;
}

.title h1{
    margin-bottom:7px;
}

.title p{
    color:#777;
}

/* FORM */

.form-box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
    margin-bottom:35px;
}

.form-box h2{
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
}

.form-group.full{
    grid-column:1/-1;
}

.form-group label{
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    padding:11px;
    border:1px solid #ddd;
    border-radius:7px;
    font-size:15px;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.help{
    margin-top:6px;
    color:#777;
    font-size:13px;
}

/* PRICE BOX */

.size-box{
    border:1px solid #eee;
    padding:15px;
    border-radius:10px;
    background:#fffafb;
}

.size-box h3{
    margin-bottom:12px;
    color:#c2185b;
    font-size:16px;
}

.size-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
}

.size-row label{
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
    display:block;
}

.size-row input{
    width:100%;
}

.price-note{
    color:#777;
    font-size:12px;
    margin-top:5px;
}

/* IMAGES */

.image-area{
    border:1px dashed #ddd;
    padding:15px;
    border-radius:10px;
    background:#fffafb;
}

.image-input-row{
    margin-bottom:12px;
}

.image-input-row label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.image-input-row input{
    width:100%;
}

.image-preview-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.image-preview-box{
    position:relative;
    height:130px;
    border-radius:8px;
    overflow:hidden;
    background:#f8e7ee;
    border:1px solid #ddd;
}

.image-preview-box img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.image-number{
    position:absolute;
    top:5px;
    left:5px;
    background:#c2185b;
    color:white;
    padding:4px 7px;
    border-radius:5px;
    font-size:12px;
}

.upload-status{
    margin-top:8px;
    color:#c2185b;
    font-size:14px;
    font-weight:bold;
}

.save-btn{
    margin-top:20px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:7px;
    background:#c2185b;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:16px;
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.cancel-btn{
    margin-top:10px;
    width:100%;
    padding:11px;
    border:0;
    border-radius:7px;
    background:#eee;
    cursor:pointer;
    display:none;
}

.status{
    margin-top:12px;
    text-align:center;
    color:#c2185b;
    font-weight:bold;
}

/* PRODUCTS */

.products-title{
    margin-bottom:18px;
}

.product-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.product-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

.product-img{
    height:220px;
    background:#f8e7ee;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.product-img img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.no-image{
    font-size:55px;
}

.product-content{
    padding:16px;
}

.product-content h3{
    margin-bottom:7px;
}

.product-price{
    color:#c2185b;
    font-weight:bold;
    font-size:18px;
    margin-bottom:8px;
}

.product-info{
    color:#666;
    font-size:14px;
    line-height:1.7;
}

.card-buttons{
    display:flex;
    gap:8px;
    margin-top:14px;
}

.edit-btn,
.delete-btn{
    flex:1;
    padding:9px;
    border:0;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.edit-btn{
    background:#eee;
}

.delete-btn{
    background:#222;
    color:white;
}

/* MOBILE */

@media(max-width:800px){

    .product-list{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    .product-list{
        grid-template-columns:1fr;
    }

    .image-preview-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .size-row{
        grid-template-columns:1fr;
    }

    header{
        justify-content:center;
    }

}

</style>

</head>

<body>


<!-- LOGIN -->

<section id="loginPage">

    <div class="login-box">

        <h1>Zaree Collection</h1>

        <p>Admin Panel</p>

        <input
            type="email"
            id="email"
            placeholder="Admin Email"
            autocomplete="email">

        <input
            type="password"
            id="password"
            placeholder="Password"
            autocomplete="current-password">

        <button

<!-- ADMIN -->

<section id="adminPage">

<header>

    <div class="logo">
        Zaree <span>Collection</span>
    </div>

    <button
        class="logout"
        onclick="logout()">

        Logout

    </button>

</header>


<div class="container">

    <div class="title">

        <h1>Admin Dashboard</h1>

        <p>
            Add and manage your beauty products

    </div>


    <!-- PRODUCT FORM -->

    <div class="form-box">

        <h2 id="formTitle">

        </h2>

            <!-- NAME -->

            <div class="form-group">

                <label>Product Name</label>

                <input
                    id="productName"

            <!-- CATEGORY -->

            <div class="form-group">

            <!-- IMAGES -->

            <div class="form-group full">

                <label>
                    Product Images — Maximum 6

                <div class="image-area">

                    <div class="image-input-row">

                        <label>Image 1</label>

                        <input
                            type="file"

                    <div class="image-input-row">

                        <label>Image 2</label>

                        <input
                            type="file"
                            id="image2"

                    </div>


                    <div class="image-input-row">

                        <label>Image 3</label>

                        <input
                            type="file"
                            id="image3"
                            accept="image/*">

                    </div>


                    <div class="image-input-row">

                        <label>Image 4</label>

                        <input
                            type="file"
                            id="image4"
                            accept="image/*">

                    </div>


                    <div class="image-input-row">

                        <label>Image 5</label>

                        <input
                            type="file"
                            id="image5"
                            accept="image/*">

                    </div>


                    <div class="image-input-row">

                        <label>Image 6</label>

                        <input
                            type="file"
                            id="image6"

                    <div

            <!-- DESCRIPTION -->

        </div>


        <button

            Add Product

        </button>


        <button

            onclick="cancelEdit()">

            Cancel Edit

        </div>

    </div>


    <!-- PRODUCTS -->

    <div class="products-title">

        <h2>Your Products</h2>

    </div>

    <div

        id="productList">

        <p>Loading products...</p>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {

    apiKey:
    "AIzaSyAmMUYbXG7XrdJrjBlNZ_9MkyHA9P9aTqA",

    authDomain:
    "zaree-collection-5589b.firebaseapp.com",

    projectId:
    "zaree-collection-5589b",

    storageBucket:
    "zaree-collection-5589b.firebasestorage.app",

    messagingSenderId:
    "724088426576",

    appId:
    "1:724088426576:web:d781393dfb54e2e46ec155",

    measurementId:
    "G-CHHN119YVR"

};


const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* CLOUDINARY */

const CLOUDINARY_CLOUD_NAME =
    "fipa2xvp";

const CLOUDINARY_UPLOAD_PRESET =
    "zaree_productsgb";


let editingId = null;
let existingImages = [];


/* ELEMENTS */

const saveBtn =
    document.getElementById("saveBtn");

const statusMessage =
    document.getElementById("statusMessage");

const uploadStatus =
    document.getElementById("imageUploadStatus");

const previewGrid =
    document.getElementById("imagePreviewGrid");


/* LOGIN */

window.login = async function(){

    const email =
        document.getElementById("email")
        .value
        .trim();

    const password =
        document.getElementById("password")
        .value;

    const message =
        document.getElementById("loginMessage");


    if(!email || !password){

        message.textContent =
            "Email and password required.";

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        message.textContent = "";

    }catch(error){

        console.error(error);

        message.textContent =
            "Login failed. Check email/password.";

    }

};


/* LOGOUT */

window.logout = async function(){

    await signOut(auth);

};


/* AUTH */

onAuthStateChanged(auth,function(user){

    if(user){

        document.getElementById("loginPage")
            .style.display = "none";

        document.getElementById("adminPage")
            .style.display = "block";

        loadProducts();

    }else{

        document.getElementById("loginPage")
            .style.display = "flex";

        document.getElementById("adminPage")
            .style.display = "none";

    }

});


/* IMAGE PREVIEW */

for(let i = 1; i <= 6; i++){

    const input =
        document.getElementById("image" + i);

    input.addEventListener(
        "change",
        function(){

            previewSelectedImages();

        }
    );

}


/* PREVIEW SELECTED IMAGES */

function previewSelectedImages(){

    previewGrid.innerHTML = "";

    for(let i = 1; i <= 6; i++){

        const input =
            document.getElementById("image" + i);

        if(input.files && input.files[0]){

            const url =
                URL.createObjectURL(
                    input.files[0]
                );

            previewGrid.innerHTML += `

                <div class="image-preview-box">

                    <img
                        src="${url}"
                        alt="Product Image ${i}"
                    >

                    <div class="image-number">
                        Image ${i}
                    </div>

                </div>

            `;

        }

    }

}


/* UPLOAD ONE IMAGE */

async function uploadImage(file){

    if(!file.type.startsWith("image/")){

        throw new Error(
            "Only image files are allowed."
        );

    }


    if(file.size > 10 * 1024 * 1024){

        throw new Error(
            "Each image must be smaller than 10MB."
        );

    }


    const formData =
        new FormData();


    formData.append(
        "file",
        file
    );


    formData.append(
        "upload_preset",
        CLOUDINARY_UPLOAD_PRESET
    );


    const response =
        await fetch(

            `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,

            {
                method:"POST",
                body:formData
            }

        );


    const data =
        await response.json();


    if(!response.ok){

        throw new Error(
            data.error?.message ||
            "Image upload failed."
        );

    }


    return data.secure_url;

}


/* GET IMAGES */

async function getImages(){

    const images = [];


    for(let i = 1; i <= 6; i++){

        const input =
            document.getElementById("image" + i);

        if(input.files && input.files[0]){

            uploadStatus.textContent =
                `Uploading image ${i} of 6... ⏳`;

            const url =
                await uploadImage(
                    input.files[0]
                );

            images.push(url);

        }

    }


    return images;

}


/* SAVE PRODUCT */

window.saveProduct = async function(){

    const name =
        document.getElementById("productName")
        .value
        .trim();

    const category =
        document.getElementById("productCategory")
        .value;

    const stock =
        Number(
            document.getElementById("productStock")
            .value || 0
        );

    const rating =
        Number(
            document.getElementById("productRating")
            .value || 5
        );

    const colorsText =
        document.getElementById("productColors")
        .value
        .trim();

    const description =
        document.getElementById("productDescription")
        .value
        .trim();


    const small =
        Number(
            document.getElementById("smallPrice")
            .value || 0
        );

    const medium =
        Number(
            document.getElementById("mediumPrice")
            .value || 0
        );

    const large =
        Number(
            document.getElementById("largePrice")
            .value || 0
        );


    if(!name){

        statusMessage.textContent =
            "Product name is required.";

        return;

    }


    if(
        small <= 0 &&
        medium <= 0 &&
        large <= 0
    ){

        statusMessage.textContent =
            "At least one size price is required.";

        return;

    }


    saveBtn.disabled = true;

    statusMessage.textContent =
        "Saving product... ⏳";


    try{

        /* UPLOAD NEW IMAGES */

        const newImages =
            await getImages();


        /* KEEP OLD IMAGES DURING EDIT */

        let finalImages = [];


        if(editingId){

            finalImages =
                existingImages.slice();

        }


        finalImages =
            finalImages.concat(
                newImages
            );


        finalImages =
            finalImages.slice(
                0,
                6
            );


        if(!editingId && finalImages.length === 0){

            throw new Error(
                "Please select at least one product image."
            );

        }


        /* SIZES */

        const sizes = {};


        if(small > 0){

            sizes.Small = {
                price:small
            };

        }


        if(medium > 0){

            sizes.Medium = {
                price:medium
            };

        }


        if(large > 0){

            sizes.Large = {
                price:large
            };

        }


        /* COLORS */

        const colors =
            colorsText

            ?

            colorsText
                .split(",")
                .map(
                    item => item.trim()
                )
                .filter(Boolean)

            :

            [];


        /* MAIN PRICE */

        const prices =
            Object.values(sizes)
                .map(
                    item => item.price
                );


        const mainPrice =
            Math.min(...prices);


        /* PRODUCT DATA */

        const product = {

            name:name,

            price:mainPrice,

            category:category,

            stock:stock,

            rating:rating,

            sizes:sizes,

            colors:colors,

            images:finalImages,

            /* Old field retained for compatibility */

            image:finalImages[0] || "",

            description:description,

            updatedAt:
                serverTimestamp()

        };


        if(editingId){

            await updateDoc(

                doc(
                    db,
                    "products",
                    editingId
                ),

                product

            );


            statusMessage.textContent =
                "Product updated successfully. ✅";

        }else{

            await addDoc(

                collection(
                    db,
                    "products"
                ),

                {

                    ...product,

                    createdAt:
                        serverTimestamp()

                }

            );


            statusMessage.textContent =
                "Product added successfully. ✅";

        }


        clearForm();

        await loadProducts();


    }catch(error){

        console.error(error);

        statusMessage.textContent =
            "Error: " + error.message;

    }finally{

        saveBtn.disabled = false;

        uploadStatus.textContent = "";

    }

};


/* LOAD PRODUCTS */

async function loadProducts(){

    const list =
        document.getElementById(
            "productList"
        );


    list.innerHTML =
        "<p>Loading products...</p>";


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        if(snapshot.empty){

            list.innerHTML =
                "<p>No products added yet.</p>";

            return;

        }


        list.innerHTML = "";


        snapshot.forEach(function(item){

            const product =
                item.data();

            const id =
                item.id;


            const images =
                Array.isArray(product.images)
                && product.images.length

                ?

                product.images

                :

                (
                    product.image
                    ?
                    [product.image]
                    :
                    []
                );


            const firstImage =
                images[0];


            const imageHTML =
                firstImage

                ?

                `<img
                    src="${escapeHTML(firstImage)}"
                    alt="${escapeHTML(product.name || "Product")}"
                    loading="lazy"
                >`

                :

                `<div class="no-image">
                    💄
                </div>`;


            const sizeText =
                formatSizes(
                    product.sizes
                );


            const colorsText =
                Array.isArray(product.colors)

                ?

                product.colors.join(", ")

                :

                (
                    product.colors || "-"
                );


            list.innerHTML += `

                <div class="product-card">

                    <div class="product-img">

                        ${imageHTML}

                    </div>


                    <div class="product-content">

                        <h3>
                            ${escapeHTML(
                                product.name || ""
                            )}
                        </h3>


                        <div class="product-price">

                            From Rs.
                            ${product.price || 0}

                        </div>


                        <div class="product-info">

                            Category:
                            ${escapeHTML(
                                product.category || "-"
                            )}

                            <br>

                            Rating:
                            ${"★".repeat(
                                Math.max(
                                    0,
                                    Math.min(
                                        5,
                                        Number(
                                            product.rating || 0
                                        )
                                    )
                                )
                            )}

                            <br>

                            Stock:
                            ${product.stock ?? 0}

                            <br>

                            Sizes:
                            ${escapeHTML(sizeText)}

                            <br>

                            Colors:
                            ${escapeHTML(colorsText)}

                            <br>

                            Images:
                            ${images.length}/6

                        </div>


                        <div class="card-buttons">

                            <button
                                class="edit-btn"
                                onclick="editProduct('${id}')">

                                Edit

                            </button>


                            <button
                                class="delete-btn"
                                onclick="deleteProduct('${id}')">

                                Delete

                            </button>

                        </div>

                    </div>

                </div>

            `;

        });


    }catch(error){

        console.error(error);

        list.innerHTML =
            "<p>Could not load products.</p>";

    }

}


/* FORMAT SIZES */

function formatSizes(sizes){

    if(!sizes){

        return "-";

    }


    if(typeof sizes === "string"){

        return sizes;

    }


    if(typeof sizes === "object"){

        const result = [];


        Object.keys(sizes).forEach(function(size){

            const value =
                sizes[size];


            const price =
                typeof value === "object"

                ?

                value.price

                :

                value;


            result.push(
                `${size}: Rs. ${price || 0}`
            );

        });


        return result.join(" | ");

    }


    return "-";

}


/* EDIT PRODUCT */

window.editProduct = async function(id){

    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "products"
                )
            );


        let found = null;


        snapshot.forEach(function(item){

            if(item.id === id){

                found = {

                    id:item.id,

                    ...item.data()

                };

            }

        });


        if(!found){

            alert(
                "Product not found."
            );

            return;

        }


        editingId =
            id;


        document.getElementById(
            "productName"
        ).value =
            found.name || "";


        document.getElementById(
            "productCategory"
        ).value =
            found.category || "Makeup";


        document.getElementById(
            "productStock"
        ).value =
            found.stock || 0;


        document.getElementById(
            "productRating"
        ).value =
            found.rating || 5;


        /* COLORS */

        if(Array.isArray(found.colors)){

            document.getElementById(
                "productColors"
            ).value =
                found.colors.join(", ");

        }else{

            document.getElementById(
                "productColors"
            ).value =
                found.colors || "";

        }


        /* SIZES */

        document.getElementById(
            "smallPrice"
        ).value = "";

        document.getElementById(
            "mediumPrice"
        ).value = "";

        document.getElementById(
            "largePrice"
        ).value = "";


        if(found.sizes){

            const sizes =
                found.sizes;


            if(
                typeof sizes === "object"
                &&
                !Array.isArray(sizes)
            ){

                if(sizes.Small){

                    document.getElementById(
                        "smallPrice"
                    ).value =
                        typeof sizes.Small === "object"

                        ?

                        sizes.Small.price || ""

                        :

                        sizes.Small;

                }


                if(sizes.Medium){

                    document.getElementById(
                        "mediumPrice"
                    ).value =
                        typeof sizes.Medium === "object"

                        ?

                        sizes.Medium.price || ""

                        :

                        sizes.Medium;

                }


                if(sizes.Large){

                    document.getElementById(
                        "largePrice"
                    ).value =
                        typeof sizes.Large === "object"

                        ?

                        sizes.Large.price || ""

                        :

                        sizes.Large;

                }

            }

        }


        /* IMAGES */

        if(
            Array.isArray(found.images)
        ){

            existingImages =
                found.images.slice(0,6);

        }else if(found.image){

            existingImages =
                [found.image];

        }else{

            existingImages = [];

        }


        showExistingImages();


        /* RESET FILE INPUTS */

        for(let i = 1; i <= 6; i++){

            document.getElementById(
                "image" + i
            ).value = "";

        }


        document.getElementById(
            "productDescription"
        ).value =
            found.description || "";


        document.getElementById(
            "formTitle"
        ).textContent =
            "Edit Product";


        document.getElementById(
            "saveBtn"
        ).textContent =
            "Update Product";


        document.getElementById(
            "cancelBtn"
        ).style.display =
            "block";


        statusMessage.textContent =
            "Editing product...";


        window.scrollTo({

            top:0,

            behavior:"smooth"

        });


    }catch(error){

        console.error(error);

        alert(
            "Could not open product."
        );

    }

};


/* SHOW EXISTING IMAGES */

function showExistingImages(){

    previewGrid.innerHTML = "";


    existingImages.forEach(
        function(url,index){

            previewGrid.innerHTML += `

                <div class="image-preview-box">

                    <img
                        src="${escapeHTML(url)}"
                        alt="Existing Image ${index + 1}"
                    >

                    <div class="image-number">
                        Image ${index + 1}
                    </div>

                </div>

            `;

        }
    );

}


/* DELETE */

window.deleteProduct = async function(id){

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if(!confirmDelete){

        return;

    }


    try{

        await deleteDoc(

            doc(
                db,
                "products",
                id
            )

        );


        await loadProducts();


    }catch(error){

        console.error(error);

        alert(
            "Could not delete product."
        );

    }

};


/* CANCEL */

window.cancelEdit = function(){

    clearForm();

};


/* CLEAR */

function clearForm(){

    editingId = null;

    existingImages = [];


    document.getElementById(
        "productName"
    ).value = "";


    document.getElementById(
        "productCategory"
    ).value = "Makeup";


    document.getElementById(
        "productStock"
    ).value = "";


    document.getElementById(
        "productRating"
    ).value = "5";


    document.getElementById(
        "smallPrice"
    ).value = "";


    document.getElementById(
        "mediumPrice"
    ).value = "";


    document.getElementById(
        "largePrice"
    ).value = "";


    document.getElementById(
        "productColors"
    ).value = "";


    document.getElementById(
        "productDescription"
    ).value = "";


    for(let i = 1; i <= 6; i++){

        document.getElementById(
            "image" + i
        ).value = "";

    }


    previewGrid.innerHTML = "";

    uploadStatus.textContent = "";


    document.getElementById(
        "formTitle"
    ).textContent =
        "Add New Product";


    document.getElementById(
        "saveBtn"
    ).textContent =
        "Add Product";


    document.getElementById(
        "cancelBtn"
    ).style.display =
        "none";


    statusMessage.textContent = "";

}


/* ESCAPE HTML */

function escapeHTML(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
